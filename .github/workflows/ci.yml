name: SPMS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend tests run_demo.py run_tests.py

      - name: Run focused lint checks
        run: python -m flake8 backend tests run_demo.py run_tests.py --select=E9,F63,F7,F82 --max-line-length=120

      - name: Run automated tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

